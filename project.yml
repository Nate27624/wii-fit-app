name: WeightTracker
options:
  minimumXcodeGenVersion: 2.43.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  WeightTracker:
    type: application
    platform: iOS
    sources:
      - path: WeightTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wiifit.weighttracker
        DEVELOPMENT_TEAM: 4QJKW5H6GB
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: WeightTracker/Info.plist
        PRODUCT_NAME: WeightTracker
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: WeightTracker/Info.plist
      properties:
        CFBundleDisplayName: Weight Tracker
        UILaunchScreen:
          UIColorName: LaunchScreenBackground
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
  WeightTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WeightTrackerTests
    dependencies:
      - target: WeightTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wiifit.weighttracker.tests
  WeightTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WeightTrackerUITests
    dependencies:
      - target: WeightTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wiifit.weighttracker.uitests
schemes:
  WeightTracker:
    build:
      targets:
        WeightTracker: all
        WeightTrackerTests: [test]
        WeightTrackerUITests: [test]
    test:
      targets:
        - WeightTrackerTests
        - WeightTrackerUITests
